name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    if: github.repository == 'Found-in-Space/voice-os'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out tagged commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Show toolchain versions
        run: |
          node --version
          npm --version
      - name: Verify tag and select npm dist-tag
        id: version
        run: npm run release:metadata
      - name: Install dependencies
        run: npm ci
      - name: Run release verification
        run: npm run verify:release
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Publish package with provenance
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ steps.version.outputs.dist_tag }}
